<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" font-family="Segoe UI, Helvetica, Arial, sans-serif">

  <!-- ══════════════════════════ Defs: gradients, filters ══════════════════════════ -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="reactGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#61dafb"/>
      <stop offset="100%" stop-color="#0ea5c9"/>
    </linearGradient>
    <linearGradient id="fastapiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05998b"/>
      <stop offset="100%" stop-color="#049688"/>
    </linearGradient>
    <linearGradient id="langgraphGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c3c3c"/>
      <stop offset="100%" stop-color="#2d5f5f"/>
    </linearGradient>
    <linearGradient id="neo4jGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#018bff"/>
      <stop offset="100%" stop-color="#0056b3"/>
    </linearGradient>
    <linearGradient id="postgresGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#336791"/>
      <stop offset="100%" stop-color="#1d4560"/>
    </linearGradient>
    <linearGradient id="azureGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0078d4"/>
      <stop offset="100%" stop-color="#005a9e"/>
    </linearGradient>
    <linearGradient id="anthropicGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97757"/>
      <stop offset="100%" stop-color="#b8583a"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- ══════════════════════════ Background ══════════════════════════ -->
  <rect width="1600" height="1080" fill="url(#bgGrad)"/>

  <!-- ══════════════════════════ Title bar ══════════════════════════ -->
  <rect x="0" y="0" width="1600" height="90" fill="url(#headerGrad)"/>
  <circle cx="60" cy="45" r="26" fill="#ffffff" opacity="0.15"/>
  <circle cx="60" cy="36" r="6" fill="#bfdbfe"/>
  <circle cx="50" cy="52" r="5" fill="#bfdbfe" opacity="0.85"/>
  <circle cx="70" cy="52" r="5" fill="#bfdbfe" opacity="0.85"/>
  <line x1="60" y1="40" x2="50" y2="49" stroke="#dbeafe" stroke-width="1.5"/>
  <line x1="60" y1="40" x2="70" y2="49" stroke="#dbeafe" stroke-width="1.5"/>
  <text x="105" y="40" fill="#ffffff" font-size="24" font-weight="700">Payment Reference Architecture (PRA) Chatbot</text>
  <text x="105" y="65" fill="#dbeafe" font-size="14" font-weight="400">Executive Architecture Overview &#8212; AI-Powered Knowledge Assistant</text>
  <text x="1540" y="52" fill="#dbeafe" font-size="13" text-anchor="end" font-weight="500">Confidential &#8212; Internal Use</text>

  <!-- ══════════════════════════ LAYER LABELS (left rail) ══════════════════════════ -->
  <text x="40" y="170" fill="#64748b" font-size="11" font-weight="700" letter-spacing="1.5">CLIENT</text>
  <text x="40" y="352" fill="#64748b" font-size="11" font-weight="700" letter-spacing="1.5">APPLICATION</text>
  <text x="40" y="367" fill="#64748b" font-size="11" font-weight="700" letter-spacing="1.5">&amp; ORCHESTRATION</text>
  <text x="40" y="545" fill="#64748b" font-size="11" font-weight="700" letter-spacing="1.5">DATA</text>
  <text x="40" y="560" fill="#64748b" font-size="11" font-weight="700" letter-spacing="1.5">INGESTION</text>
  <text x="40" y="700" fill="#64748b" font-size="11" font-weight="700" letter-spacing="1.5">KNOWLEDGE</text>
  <text x="40" y="715" fill="#64748b" font-size="11" font-weight="700" letter-spacing="1.5">&amp; DATA</text>
  <text x="40" y="890" fill="#64748b" font-size="11" font-weight="700" letter-spacing="1.5">AI / LLM</text>
  <text x="40" y="905" fill="#64748b" font-size="11" font-weight="700" letter-spacing="1.5">SERVICES</text>

  <!-- ══════════════════════════ 1. CLIENT LAYER ══════════════════════════ -->
  <g filter="url(#cardShadow)">
    <rect x="140" y="120" width="1360" height="100" rx="14" fill="#111827" stroke="#334155" stroke-width="1"/>
  </g>
  <!-- React icon (atom) -->
  <g transform="translate(190,170)">
    <circle r="6" fill="url(#reactGrad)"/>
    <ellipse rx="34" ry="13" fill="none" stroke="url(#reactGrad)" stroke-width="2.5"/>
    <ellipse rx="34" ry="13" fill="none" stroke="url(#reactGrad)" stroke-width="2.5" transform="rotate(60)"/>
    <ellipse rx="34" ry="13" fill="none" stroke="url(#reactGrad)" stroke-width="2.5" transform="rotate(120)"/>
  </g>
  <text x="250" y="158" fill="#f1f5f9" font-size="17" font-weight="700">Web Chat Application</text>
  <text x="250" y="178" fill="#94a3b8" font-size="12.5">Simple browser-based chat &#8212; ask questions in plain English, get instant answers</text>
  <text x="250" y="196" fill="#64748b" font-size="11.5">Used by Business Analysts &amp; Payment Subject Matter Experts &#8212; no installation required</text>

  <rect x="1230" y="145" width="220" height="50" rx="10" fill="#0b1220" stroke="#334155"/>
  <text x="1340" y="165" fill="#cbd5e1" font-size="12" text-anchor="middle" font-weight="600">Secure Connection</text>
  <text x="1340" y="182" fill="#64748b" font-size="10.5" text-anchor="middle">Real-time streaming responses</text>

  <!-- connector down -->
  <line x1="800" y1="220" x2="800" y2="260" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ══════════════════════════ 2. APPLICATION / ORCHESTRATION LAYER ══════════════════════════ -->
  <g filter="url(#cardShadow)">
    <rect x="140" y="260" width="1360" height="190" rx="14" fill="#111827" stroke="#334155" stroke-width="1"/>
  </g>

  <g transform="translate(190,300)">
    <rect x="-16" y="-16" width="32" height="32" rx="16" fill="url(#fastapiGrad)"/>
    <path d="M -6,-2 L 3,-2 L -2,8 L 6,8" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="220" y="296" fill="#f1f5f9" font-size="16.5" font-weight="700">AI Assistant Engine</text>
  <text x="220" y="313" fill="#94a3b8" font-size="12">Intelligent orchestration &#8212; understands, retrieves, and responds in real time</text>

  <!-- Capability chips (executive summary, no implementation detail) -->
  <g font-size="12.5" font-weight="600">
    <g transform="translate(190,350)">
      <rect width="290" height="66" rx="10" fill="#0f2929" stroke="#5eead4" stroke-width="1.2"/>
      <text x="145" y="28" fill="#5eead4" text-anchor="middle">Understand the Question</text>
      <text x="145" y="48" fill="#6ee7c9" font-size="10.5" font-weight="400" text-anchor="middle">Interprets intent &amp; conversation context</text>
    </g>
    <g transform="translate(510,350)">
      <rect width="290" height="66" rx="10" fill="#0f2929" stroke="#5eead4" stroke-width="1.2"/>
      <text x="145" y="28" fill="#5eead4" text-anchor="middle">Retrieve the Right Knowledge</text>
      <text x="145" y="48" fill="#6ee7c9" font-size="10.5" font-weight="400" text-anchor="middle">Searches the knowledge base for evidence</text>
    </g>
    <g transform="translate(830,350)">
      <rect width="290" height="66" rx="10" fill="#0f2929" stroke="#5eead4" stroke-width="1.2"/>
      <text x="145" y="28" fill="#5eead4" text-anchor="middle">Validate the Answer</text>
      <text x="145" y="48" fill="#6ee7c9" font-size="10.5" font-weight="400" text-anchor="middle">Checks confidence before responding</text>
    </g>
    <g transform="translate(1150,350)">
      <rect width="260" height="66" rx="10" fill="#0f2929" stroke="#5eead4" stroke-width="1.2"/>
      <text x="130" y="28" fill="#5eead4" text-anchor="middle">Remember the Conversation</text>
      <text x="130" y="48" fill="#6ee7c9" font-size="10.5" font-weight="400" text-anchor="middle">Keeps full context across follow-ups</text>
    </g>

    <line x1="480" y1="383" x2="508" y2="383" stroke="#5eead4" stroke-width="1.6" marker-end="url(#arrow)"/>
    <line x1="800" y1="383" x2="828" y2="383" stroke="#5eead4" stroke-width="1.6" marker-end="url(#arrow)"/>
    <line x1="1120" y1="383" x2="1148" y2="383" stroke="#5eead4" stroke-width="1.6" marker-end="url(#arrow)"/>
  </g>

  <text x="220" y="440" fill="#7fc9c9" font-size="11" font-style="italic">Every answer follows the same consistent, auditable reasoning process</text>

  <!-- connector down to Data Ingestion layer -->
  <line x1="800" y1="450" x2="800" y2="490" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ══════════════════════════ 3. DATA INGESTION PIPELINE LAYER (between Application &amp; Data) ══════════════════════════ -->
  <g filter="url(#cardShadow)">
    <rect x="140" y="490" width="1360" height="150" rx="14" fill="#111827" stroke="#334155" stroke-width="1"/>
  </g>
  <text x="170" y="522" fill="#f1f5f9" font-size="16.5" font-weight="700">&#128193; Data Ingestion Pipeline</text>
  <text x="170" y="540" fill="#94a3b8" font-size="12">Automated, offline process that keeps the knowledge base current &#8212; runs independently of live chat</text>

  <g font-size="12.5" font-weight="600">
    <g transform="translate(280,555)">
      <rect width="270" height="60" rx="10" fill="#1c1b0f" stroke="#eab308" stroke-width="1.2"/>
      <text x="135" y="26" fill="#facc15" text-anchor="middle">Read Source Documents</text>
      <text x="135" y="45" fill="#ca8a04" font-size="10.5" font-weight="400" text-anchor="middle">Policies, standards &amp; reference material</text>
    </g>
    <g transform="translate(670,555)">
      <rect width="270" height="60" rx="10" fill="#1c1b0f" stroke="#eab308" stroke-width="1.2"/>
      <text x="135" y="26" fill="#facc15" text-anchor="middle">AI-Powered Extraction</text>
      <text x="135" y="45" fill="#ca8a04" font-size="10.5" font-weight="400" text-anchor="middle">Identifies domains, rules &amp; relationships</text>
    </g>
    <g transform="translate(1060,555)">
      <rect width="270" height="60" rx="10" fill="#1c1b0f" stroke="#eab308" stroke-width="1.2"/>
      <text x="135" y="26" fill="#facc15" text-anchor="middle">Update Knowledge Base</text>
      <text x="135" y="45" fill="#ca8a04" font-size="10.5" font-weight="400" text-anchor="middle">Validated &amp; written automatically</text>
    </g>
    <line x1="550" y1="585" x2="668" y2="585" stroke="#eab308" stroke-width="1.6" marker-end="url(#arrow)"/>
    <line x1="940" y1="585" x2="1058" y2="585" stroke="#eab308" stroke-width="1.6" marker-end="url(#arrow)"/>
  </g>

  <!-- connector down to Data layer -->
  <line x1="500" y1="640" x2="500" y2="665" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1100" y1="640" x2="1100" y2="665" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ══════════════════════════ 4. KNOWLEDGE &amp; DATA LAYER ══════════════════════════ -->
  <!-- Neo4j card -->
  <g filter="url(#cardShadow)">
    <rect x="330" y="665" width="340" height="120" rx="14" fill="url(#neo4jGrad)"/>
  </g>
  <g transform="translate(370,705)">
    <circle r="16" fill="#ffffff" opacity="0.18"/>
    <circle cx="0" cy="-8" r="5" fill="#ffffff"/>
    <circle cx="-9" cy="6" r="5" fill="#ffffff"/>
    <circle cx="9" cy="6" r="5" fill="#ffffff"/>
    <line x1="0" y1="-8" x2="-9" y2="6" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="0" y1="-8" x2="9" y2="6" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="-9" y1="6" x2="9" y2="6" stroke="#ffffff" stroke-width="1.5"/>
  </g>
  <text x="400" y="700" fill="#ffffff" font-size="16.5" font-weight="700">Knowledge Graph</text>
  <text x="400" y="718" fill="#dbeafe" font-size="12">The organization's payment domain expertise, structured &amp; connected</text>
  <text x="360" y="746" fill="#eff6ff" font-size="11.5">&#8226; Domains, functions, rules &amp; patterns &#8212; all linked together</text>
  <text x="360" y="764" fill="#eff6ff" font-size="11.5">&#8226; Enables precise, explainable answers</text>

  <!-- PostgreSQL card -->
  <g filter="url(#cardShadow)">
    <rect x="930" y="665" width="340" height="120" rx="14" fill="url(#postgresGrad)"/>
  </g>
  <g transform="translate(970,705)">
    <ellipse rx="15" ry="17" fill="#ffffff" opacity="0.18"/>
    <path d="M -9,-6 Q 0,-16 9,-6 Q 12,6 0,14 Q -12,6 -9,-6 Z" fill="#ffffff"/>
  </g>
  <text x="1000" y="700" fill="#ffffff" font-size="16.5" font-weight="700">Conversation History</text>
  <text x="1000" y="718" fill="#dbeafe" font-size="12">Secure record of every session &amp; interaction</text>
  <text x="960" y="746" fill="#eff6ff" font-size="11.5">&#8226; Enables seamless follow-up conversations</text>
  <text x="960" y="764" fill="#eff6ff" font-size="11.5">&#8226; Full audit trail for compliance</text>

  <!-- ══════════════════════════ 5. AI / LLM SERVICES LAYER ══════════════════════════ -->
  <!-- Azure AI Foundry / Claude card -->
  <g filter="url(#cardShadow)">
    <rect x="330" y="840" width="500" height="115" rx="14" fill="#0b1220" stroke="#334155"/>
  </g>
  <g transform="translate(375,880)">
    <rect x="-15" y="-15" width="30" height="30" rx="6" fill="url(#azureGrad)"/>
    <path d="M -6,8 L 0,-8 L 6,8 L 2,8 L 0,2 L -2,8 Z" fill="#ffffff"/>
  </g>
  <g transform="translate(430,880)">
    <circle r="15" fill="url(#anthropicGrad)"/>
    <text x="0" y="5" fill="#ffffff" font-size="14" font-weight="800" text-anchor="middle">A</text>
  </g>
  <text x="465" y="873" fill="#f1f5f9" font-size="15.5" font-weight="700">Enterprise AI (Azure + Claude)</text>
  <text x="465" y="890" fill="#94a3b8" font-size="12">Generates natural, accurate answers</text>
  <text x="360" y="918" fill="#cbd5e1" font-size="11.5">&#8226; Answers are always grounded in verified company knowledge</text>
  <text x="360" y="936" fill="#cbd5e1" font-size="11.5">&#8226; Enterprise-grade security &amp; compliance</text>

  <!-- Azure OpenAI Embeddings card -->
  <g filter="url(#cardShadow)">
    <rect x="870" y="840" width="400" height="115" rx="14" fill="#0b1220" stroke="#334155"/>
  </g>
  <g transform="translate(915,880)">
    <rect x="-15" y="-15" width="30" height="30" rx="6" fill="url(#azureGrad)"/>
    <path d="M -6,8 L 0,-8 L 6,8 L 2,8 L 0,2 L -2,8 Z" fill="#ffffff"/>
  </g>
  <text x="950" y="873" fill="#f1f5f9" font-size="15.5" font-weight="700">Smart Search (Azure OpenAI)</text>
  <text x="950" y="890" fill="#94a3b8" font-size="12">Understands meaning, not just keywords</text>
  <text x="900" y="918" fill="#cbd5e1" font-size="11.5">&#8226; Finds relevant answers even with imprecise questions</text>

  <!-- connectors AI layer <-> data layer -->
  <line x1="580" y1="785" x2="580" y2="838" stroke="#475569" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <line x1="1070" y1="785" x2="1070" y2="838" stroke="#475569" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- ══════════════════════════ Legend / footer ══════════════════════════ -->
  <line x1="140" y1="990" x2="1500" y2="990" stroke="#334155" stroke-width="1"/>
  <text x="140" y="1009" fill="#64748b" font-size="11">Solid arrows = live request flow &#183; Dashed arrows = supporting AI services &amp; automated updates &#183; All services run within the enterprise network</text>
  <text x="1500" y="1009" fill="#64748b" font-size="11" text-anchor="end">v1.2 &#183; September 2026</text>

</svg>
